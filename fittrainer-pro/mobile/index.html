<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0A0A0C">
<title>FitTrainer Remote</title>
<style>
:root{
  --bg:#0A0A0C; --surface:#111114; --panel:#17171B; --border:#222228;
  --text:#EBEBEF; --dim:#7A7A86; --accent:#7C3AED; --warn:#F59E0B; --danger:#E84040;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer;border:none;color:var(--text)}
[hidden]{display:none!important}

/* ---- 로그인 ---- */
.login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:32px 24px;gap:18px}
.login h1{font-size:20px;font-weight:700;color:var(--accent)}
.login p{font-size:13px;color:var(--dim);text-align:center;line-height:1.5}
.pin-input{width:100%;max-width:260px;padding:16px;border-radius:12px;text-align:center;
  font-size:26px;font-weight:700;letter-spacing:8px;background:var(--panel);
  color:var(--text);border:1px solid var(--border);outline:none;font-variant-numeric:tabular-nums}
.pin-input:focus{border-color:var(--accent)}
.login .err{font-size:13px;color:var(--danger);min-height:18px}

/* ---- 헤더 ---- */
.top{position:sticky;top:0;z-index:10;background:rgba(10,10,12,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  padding:12px 16px;display:flex;align-items:center;gap:10px}
.top h1{font-size:15px;font-weight:700;color:var(--accent);flex:1}
.dot{width:7px;height:7px;border-radius:4px;background:var(--danger)}
.dot.on{background:#22C55E}
.top .who{font-size:11px;color:var(--dim)}

/* ---- 현재 동작 ---- */
.now{margin:14px 16px;padding:18px;border-radius:14px;background:var(--surface);
  border:1px solid var(--border)}
.now .lab{font-size:10px;color:var(--dim);letter-spacing:1.4px;text-transform:uppercase}
.now .title{font-size:22px;font-weight:700;margin-top:6px;line-height:1.25;word-break:keep-all}
.now .meta{font-size:13px;color:var(--dim);margin-top:8px;display:flex;gap:8px;
  align-items:center;flex-wrap:wrap}
.chip{font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px}
.bar{height:4px;border-radius:2px;background:var(--border);margin-top:14px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
.now.resting{background:rgba(245,158,11,.10);border-color:rgba(245,158,11,.35)}
.now.resting .title{color:var(--warn)}
.now.breaking{background:rgba(34,197,94,.10);border-color:rgba(34,197,94,.35)}
.now.breaking .title{color:#22C55E}
.item.brk{background:rgba(34,197,94,.10);border-color:rgba(34,197,94,.30);
  color:#22C55E;font-weight:600}
.times{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--dim);
  font-variant-numeric:tabular-nums;flex-wrap:wrap}
.times b{color:var(--text);font-weight:600}
.times .left{color:var(--accent);font-weight:600}

/* ---- 컨트롤 ---- */
.ctl{padding:0 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px}
.b{flex:1;padding:15px 10px;border-radius:12px;font-size:14px;font-weight:600;
  background:var(--panel);transition:transform .1s,background .15s;
  display:flex;align-items:center;justify-content:center;gap:7px}
.b:active{transform:scale(.96);background:#1F1F26}
.b.primary{background:var(--accent);padding:20px}
.b.primary:active{background:#8B5CF6}
.b.warn{background:rgba(245,158,11,.16);color:var(--warn)}
.b svg{width:20px;height:20px;fill:currentColor}
.seg{display:flex;gap:3px;padding:3px;border-radius:12px;background:var(--panel)}
.seg button{flex:1;padding:11px 0;border-radius:9px;font-size:13px;font-weight:600;
  background:transparent;color:var(--dim);font-variant-numeric:tabular-nums}
.seg button.on{background:var(--accent);color:#fff}

/* ---- 큐 ---- */
.q{padding:18px 16px 32px}
.q-head{display:flex;align-items:center;gap:8px;padding:6px 2px 10px}
.q-head span{font-size:11px;color:var(--dim);letter-spacing:1.2px;text-transform:uppercase}
.q-head button{margin-left:auto;font-size:12px;color:var(--dim);background:none;padding:4px}
.q-head button.on{color:var(--accent)}
.item{display:flex;align-items:center;gap:9px;padding:11px 10px;border-radius:10px;
  font-size:14px;margin-bottom:3px;background:var(--surface);border:1px solid transparent}
.item.active{border-color:var(--accent);background:rgba(124,58,237,.12)}
.item.done{opacity:.4}
.item .idx{width:22px;text-align:center;font-size:11px;color:var(--dim);
  font-variant-numeric:tabular-nums;flex-shrink:0}
.item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sets{font-size:11px;color:var(--dim);flex-shrink:0;font-variant-numeric:tabular-nums}
.item .del{flex-shrink:0;width:30px;height:30px;border-radius:8px;background:transparent;
  color:var(--dim);font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center}
.item .del:active{background:rgba(232,64,64,.2);color:var(--danger)}
.item.rest{background:transparent;font-size:13px;color:var(--dim);padding:7px 10px}
.empty{text-align:center;color:var(--dim);font-size:13px;padding:36px 16px;line-height:1.6}

/* ---- 하단 탭 ---- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
  background:rgba(10,10,12,.95);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:11px 4px 13px;background:none;color:var(--dim);
  font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button.on{color:var(--accent)}
.tabs svg{width:21px;height:21px;fill:currentColor}
.screen{padding-bottom:78px}
.srow{display:flex;align-items:center;gap:14px;margin:0 16px 8px;padding:14px;
  border-radius:12px;background:var(--surface);border:1px solid var(--border)}
.srow .t{flex:1;min-width:0}
.srow .t b{display:block;font-size:14px;font-weight:600}
.srow .t small{display:block;font-size:12px;color:var(--dim);margin-top:4px;line-height:1.5}
.tg{width:46px;height:28px;border-radius:14px;padding:3px;display:flex;flex-shrink:0;
  background:var(--border);transition:background .15s}
.tg.on{background:var(--accent);justify-content:flex-end}
.tg span{width:22px;height:22px;border-radius:11px;background:#fff;display:block}
.srow.here{border-color:var(--accent);background:rgba(124,58,237,.10)}

/* ---- 큰 화면(다른 PC·태블릿에서 열었을 때) ---- */
@media (min-width:900px){
  .top{padding:14px 24px}
  .top h1{font-size:17px}
  .screen{max-width:1080px;margin:0 auto;padding:8px 8px 90px}
  .tabs{justify-content:center;gap:8px}
  .tabs button{flex:0 0 132px}

  /* 리모컨: 왼쪽 조작, 오른쪽 프로그램 */
  #sc-remote{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:24px;align-items:start}
  #sc-remote .pane{min-width:0}
  #sc-remote .q{min-width:0;padding:0}
  #sc-remote .now{margin:0 0 14px}
  #sc-remote .ctl{padding:0}
  .b.primary{padding:18px}

  /* 목록형 화면은 2단으로 */
  #sc-customer,#sc-session,#sc-builder,#sc-settings{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:0 24px;align-content:start}
  #sc-customer > .sec,#sc-session > .sec,#sc-builder > .sec,#sc-settings > .sec{
    grid-column:1 / -1}
  .card,.srow{margin-left:0;margin-right:0}
  .field,.search{padding-left:0;padding-right:0;margin-left:0;width:100%}
  .chips{padding-left:0}
}

/* ---- 폼 ---- */
.field{padding:0 16px 14px}
.field label{display:block;font-size:11px;color:var(--dim);letter-spacing:1.1px;
  text-transform:uppercase;margin-bottom:7px}
.field input,.field select{width:100%;padding:13px;border-radius:10px;background:var(--panel);
  color:var(--text);border:1px solid var(--border);font-size:15px;outline:none;font-family:inherit}
.field input:focus,.field select:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{padding:9px 14px;border-radius:9px;background:var(--panel);
  color:var(--dim);font-size:13px;font-weight:600;border:1px solid transparent}
.chips button.on{background:rgba(124,58,237,.18);color:var(--accent);border-color:var(--accent)}
.card{margin:0 16px 8px;padding:14px;border-radius:12px;background:var(--surface);
  border:1px solid var(--border);display:flex;align-items:center;gap:11px}
.card.on{border-color:var(--accent);background:rgba(124,58,237,.10)}
.card.col{flex-direction:column;align-items:stretch;gap:10px}
.card.col .head{display:flex;align-items:center;gap:10px;min-width:0}
.card.col .acts{display:flex;align-items:center;gap:7px}
.card.col .acts .spacer{flex:1}
.card .nm{flex:1;min-width:0}
.card .nm b{display:block;font-size:15px;font-weight:600}
.card .nm small{display:block;font-size:12px;color:var(--dim);margin-top:3px}
.icon-btn{width:34px;height:34px;border-radius:9px;background:var(--panel);color:var(--dim);
  font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:active{background:#25252c;color:var(--text)}
.icon-btn.danger:active{background:rgba(232,64,64,.2);color:var(--danger)}
.sec{padding:18px 16px 8px;font-size:11px;color:var(--dim);letter-spacing:1.2px;text-transform:uppercase}
.stepper{display:flex;align-items:center;gap:6px;flex-shrink:0}
.stepper span{min-width:46px;text-align:center;font-size:12px;color:var(--dim);
  font-variant-numeric:tabular-nums}
.search{margin:0 16px 10px;width:calc(100% - 32px);padding:12px;border-radius:10px;
  background:var(--panel);color:var(--text);border:1px solid var(--border);font-size:15px;
  outline:none;font-family:inherit}
.toast{position:fixed;left:16px;right:16px;bottom:90px;z-index:30;padding:14px 16px;
  border-radius:12px;background:#2A2A32;border:1px solid var(--border);font-size:13px;
  line-height:1.5;white-space:pre-line;box-shadow:0 8px 28px rgba(0,0,0,.5)}
</style>
</head>
<body>

<!-- 로그인 -->
<div class="login" id="login">
  <h1>FitTrainer Remote</h1>
  <p>PC 앱 <b>설정 → 원격 조작</b>에 표시된<br>PIN 을 입력하세요</p>
  <input class="pin-input" id="pin" type="tel" inputmode="numeric" autocomplete="off"
         maxlength="8" placeholder="······">
  <div class="err" id="login-err"></div>
  <button class="b primary" style="max-width:260px;width:100%" id="login-btn">연결</button>
</div>

<!-- 리모컨 -->
<div id="app" hidden>
  <div class="top">
    <span class="dot" id="dot"></span>
    <h1>FitTrainer Remote</h1>
    <span class="who" id="conn">연결 중</span>
  </div>

  <div class="screen" id="sc-remote">
  <div class="pane">
  <div class="now" id="now">
    <div class="lab" id="now-lab">현재 동작</div>
    <div class="title" id="now-title">—</div>
    <div class="meta" id="now-meta"></div>
    <div class="bar"><div id="now-bar" style="width:0%"></div></div>
    <div class="times" id="now-times"></div>
  </div>

  <div class="ctl">
    <button class="b primary" id="btn-play">
      <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span id="play-label">재생</span>
    </button>
    <div class="row">
      <button class="b" data-cmd="prev">
        <svg viewBox="0 0 24 24"><path d="M7 6h2.5v12H7zm2.5 6 8.5 6V6z"/></svg>이전
      </button>
      <button class="b" data-cmd="next">
        <svg viewBox="0 0 24 24"><path d="M14.5 6H17v12h-2.5zM14.5 12 6 18V6z"/></svg>다음
      </button>
    </div>
    <button class="b warn" data-cmd="skip-rest">휴식 건너뛰기</button>
    <div class="seg" id="speed">
      <button data-v="0.5">0.5x</button><button data-v="1" class="on">1x</button>
      <button data-v="1.5">1.5x</button><button data-v="2">2x</button>
    </div>
  </div>
  </div><!-- /pane -->

  <div class="q">
    <div class="q-head">
      <span>프로그램</span>
      <button id="edit-toggle">편집</button>
    </div>
    <div id="list"></div>
  </div>
  </div><!-- /sc-remote -->

  <!-- 고객 -->
  <div class="screen" id="sc-customer" hidden>
    <div class="sec">고객 목록</div>
    <div id="cust-list"></div>
    <div class="sec">고객 추가 / 수정</div>
    <div class="field"><label>이름</label><input id="cf-name" placeholder="이름"></div>
    <div class="field"><label>나이</label><input id="cf-age" type="tel" inputmode="numeric" placeholder="나이"></div>
    <div class="field"><label>목표</label><div class="chips" id="cf-goal"></div></div>
    <div class="field"><label>경력</label><div class="chips" id="cf-exp"></div></div>
    <div class="field"><label>집중 부위</label><div class="chips" id="cf-focus"></div></div>
    <div class="ctl">
      <button class="b primary" id="cf-save">저장</button>
      <button class="b" id="cf-reset">새로 입력</button>
    </div>
  </div>

  <!-- 세션 설정 -->
  <div class="screen" id="sc-session" hidden>
    <div class="sec">프로그램 만들기</div>
    <div class="chips" style="padding:0 16px 14px" id="concepts"></div>
    <div class="sec">만들어진 프로그램</div>
    <div id="prog-list"></div>
    <div class="sec">대상 고객</div>
    <div class="card" id="sess-cust"><div class="nm"><b>—</b><small>고객 탭에서 선택하세요</small></div></div>
    <div class="field"><label>운동 시간</label><div class="chips" id="sf-dur"></div></div>
    <div class="field"><label>강도</label><div class="chips" id="sf-int"></div></div>
    <div class="field"><label>집중 부위</label><div class="chips" id="sf-focus"></div></div>
    <div class="field"><label>컨디션</label><div class="chips" id="sf-cond"></div></div>
    <div class="field"><label>구성 기법</label><div class="chips" id="sf-method"></div></div>
    <div class="ctl">
      <button class="b primary" id="sf-gen">자동 조합</button>
    </div>
  </div>

  <!-- 프로그램 빌더 -->
  <div class="screen" id="sc-builder" hidden>
    <div class="sec" id="bl-count">프로그램</div>
    <div id="bl-list"></div>
    <div class="ctl" style="padding-top:8px">
      <button class="b" id="bl-clear">전체 비우기</button>
    </div>
    <div class="sec">라이브러리에서 추가</div>
    <input class="search" id="bl-search" placeholder="동작 이름 검색">
    <div id="bl-lib"></div>
  </div>
</div>

  <!-- 설정 -->
  <div class="screen" id="sc-settings" hidden>
    <div class="sec">재생</div>
    <div id="set-play"></div>
    <div class="sec">영상 변환</div>
    <div id="set-conv"></div>
    <div class="sec">연결된 PC</div>
    <div id="set-pcs"></div>
    <div class="sec">연결</div>
    <div id="set-conn"></div>
  </div>
</div>

<div class="tabs" id="tabs" hidden>
  <button data-sc="remote" class="on">
    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>리모컨</button>
  <button data-sc="customer">
    <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5c0-3-4-5.5-9-5.5z"/></svg>고객</button>
  <button data-sc="session">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 10.6V6h-2v7.4l5.2 3.1 1-1.7-4.2-2.2z"/></svg>세션</button>
  <button data-sc="builder">
    <svg viewBox="0 0 24 24"><path d="M3 5h18v2H3zm0 6h18v2H3zm0 6h12v2H3z"/></svg>프로그램</button>
  <button data-sc="settings">
    <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 4-2.1-1.6a7 7 0 0 0-.5-1.2l.4-2.6-2.1-1.2-2.1 1.6a7 7 0 0 0-1.3-.4L12.5 4h-2.4L9.3 6.6a7 7 0 0 0-1.3.4L5.9 5.4 3.8 6.6l.4 2.6a7 7 0 0 0-.5 1.2L1.6 12l2.1 1.6c.1.4.3.8.5 1.2l-.4 2.6 2.1 1.2 2.1-1.6c.4.2.9.3 1.3.4l.8 2.6h2.4l.8-2.6c.4-.1.9-.2 1.3-.4l2.1 1.6 2.1-1.2-.4-2.6c.2-.4.4-.8.5-1.2L21 12z"/></svg>설정</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const CAT={STR:['근력','#E84040'],MOV:['움직임','#9B5CF6'],CFR:['폼롤링','#F59E0B'],
  CFS:['폼롤러스트레칭','#F97316'],CCB:['코어밸런스','#3B82F6'],CCS:['코어스트렝스','#A78BFA'],
  STT:['스트레칭','#22C55E'],CAR:['유산소','#84CC16'],TMR:['타이머','#64748B']};

const $ = id => document.getElementById(id);

const mmss = s => { s = Math.max(0, Math.round(s || 0));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const human = s => { s = Math.max(0, Math.round(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  const r = s % 60;
  if (h > 0) return m > 0 ? `${h}시간 ${m}분` : `${h}시간`;
  if (m > 0) return r > 0 ? `${m}분 ${r}초` : `${m}분`;
  return `${r}초`; };
let socket = null, editing = false, lastState = null, tick = {};
let screen = 'remote', custDraft = {}, libFilter = '';

const GOALS = ['체형교정','근력강화','다이어트','재활','균형트레이닝','체력증진'];
const LEVELS = ['초급 (6개월 미만)','중급 (6개월~2년)','고급 (2년 이상)'];
const FOCUS = ['전신','상체','하체','코어','어깨','등','가슴'];
const DURATIONS = [20,30,45,60];
const INTENSITIES = ['저강도','중강도','고강도'];
const CONDITIONS = ['컨디션 좋음','보통','피로 / 회복 필요'];
const METHODS = [['auto','자동'],['block','블록형'],['circuit','서킷형'],
  ['interleave','복합교차형'],['superset','슈퍼세트']];
const CONCEPTS = [
  ['full_strength','전신 근력'], ['cardio_core','유산소 · 코어'], ['lower','하체 집중'],
  ['circuit_full','전신 순환운동'], ['upper_core','상체 · 코어'], ['recovery','스트레칭 · 회복'],
];

/* ---------- PC 목록 ---------- */
// 토큰은 PC 마다 그 PC 의 localStorage 에만 둔다(브라우저가 출처별로 분리).
// PC 명단은 화면 이동 시 주소에 실어 옮겨 서로 알게 한다.
const KEY = 'ft_remote_token';
const PCS = 'ft_pcs';
const HERE = location.origin;

const loadPcs = () => { try { return JSON.parse(localStorage.getItem(PCS)) || []; } catch { return []; } };
const savePcs = list => { try { localStorage.setItem(PCS, JSON.stringify(list)); } catch {} };

function rememberPc(info) {
  const list = loadPcs();
  const i = list.findIndex(p => p.url === HERE);
  const entry = { url: HERE, id: info?.id || '', name: info?.name || HERE,
                  nick: i >= 0 ? list[i].nick : '' };
  if (i >= 0) list[i] = { ...list[i], ...entry }; else list.push(entry);
  savePcs(list);
}

// 다른 PC 로 옮길 때 명단을 함께 넘긴다 (토큰은 넘기지 않는다)
function gotoPc(url) {
  const roster = loadPcs().map(({ url, id, name, nick }) => ({ url, id, name, nick }));
  location.href = url + '/#pcs=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(roster)))));
}

// 주소로 넘어온 명단을 합친다
(function mergeRoster() {
  const m = location.hash.match(/pcs=([^&]+)/);
  if (!m) return;
  try {
    const incoming = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    const list = loadPcs();
    for (const pc of incoming) {
      if (!pc?.url) continue;
      const i = list.findIndex(x => x.url === pc.url);
      if (i >= 0) list[i] = { ...pc, ...list[i], nick: list[i].nick || pc.nick };
      else list.push(pc);
    }
    savePcs(list);
  } catch {}
  history.replaceState(null, '', location.pathname);
})();

const pcLabel = pc => pc.nick || pc.name || pc.url;

async function login(pin) {
  const r = await fetch('/api/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pin }),
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || '연결에 실패했습니다');
  const { token } = await r.json();
  localStorage.setItem(KEY, token);
  try { rememberPc(await (await fetch('/api/info')).json()); } catch {}
  return token;
}

$('login-btn').onclick = async () => {
  const pin = $('pin').value.trim();
  $('login-err').textContent = '';
  if (!pin) return;
  try {
    connect(await login(pin));
  } catch (e) {
    $('login-err').textContent = e.message;
    $('pin').value = '';
  }
};
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('login-btn').click(); });

function showLogin(msg) {
  localStorage.removeItem(KEY);
  socket?.close(); socket = null;
  $('app').hidden = true; $('login').hidden = false;
  $('login-err').textContent = msg || '';
  $('pin').value = '';
}

/* ---------- 연결 ---------- */
function connect(token) {
  $('login').hidden = true; $('app').hidden = false; $('tabs').hidden = false;
  socket = io({ auth: { token } });

  socket.on('connect', () => {
    const me = loadPcs().find(p => p.url === HERE);
    $('conn').textContent = me ? pcLabel(me) : '연결됨';
    $('dot').classList.add('on');
  });
  socket.on('disconnect', () => {
    $('conn').textContent = '끊김';
    $('dot').classList.remove('on');
  });
  socket.on('connect_error', err => {
    if (String(err.message).includes('unauthorized')) showLogin('다시 로그인해 주세요');
    else $('conn').textContent = '재연결 중';
  });
  socket.on('state', render);
  socket.on('tick', t => { tick = t || {}; renderTime(); });
}

const send = (type, data) => socket?.emit('command', { type, ...(data || {}) });

document.querySelectorAll('[data-cmd]').forEach(b =>
  b.onclick = () => send(b.dataset.cmd));
$('btn-play').onclick = () => send('toggle');
$('speed').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  send('speed', { v: Number(b.dataset.v) });
};
$('edit-toggle').onclick = () => {
  editing = !editing;
  $('edit-toggle').textContent = editing ? '완료' : '편집';
  $('edit-toggle').classList.toggle('on', editing);

};

/* ---------- 화면 전환 ---------- */
$('tabs').onclick = e => {

  screen = b.dataset.sc;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['remote','customer','session','builder','settings'].forEach(n => { $('sc-' + n).hidden = n !== screen; });
  window.scrollTo(0, 0);

let toastTimer = null;
function toast(msg) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 5000);
}

/* ---------- 고객 ---------- */
function chipRow(host, options, current, onPick) {
  $(host).innerHTML = options.map(o => {
    const [val, label] = Array.isArray(o) ? o : [o, o];
    return `<button data-v="${val}" class="${val === current ? 'on' : ''}">${label}</button>`;
  }).join('');
  $(host).onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    onPick(b.dataset.v);
  };
}

function renderCustomers(s) {
  const list = s.customers || [];
  $('cust-list').innerHTML = list.length ? list.map(c => `
    <div class="card ${c.id === s.activeCustomerId ? 'on' : ''}" data-id="${c.id}">
      <div class="nm"><b>${c.name || '이름 없음'}</b>
        <small>${[c.age ? c.age + '세' : '', c.goal, c.experience].filter(Boolean).join(' · ') || '정보 없음'}</small></div>
      <button class="icon-btn" data-act="edit">✎</button>
      <button class="icon-btn danger" data-act="del">✕</button>
    </div>`).join('')
    : '<div class="empty">등록된 고객이 없습니다.<br>아래에서 추가하세요.</div>';

  chipRow('cf-goal', GOALS, custDraft.goal, v => { custDraft.goal = v; renderCustomers(lastState); });
  chipRow('cf-exp', LEVELS, custDraft.experience, v => { custDraft.experience = v; renderCustomers(lastState); });
  chipRow('cf-focus', FOCUS, custDraft.focusPart, v => { custDraft.focusPart = v; renderCustomers(lastState); });
}

$('cust-list').onclick = e => {
  const card = e.target.closest('[data-id]'); if (!card) return;
  const id = card.dataset.id;
  const c = (lastState?.customers || []).find(x => x.id === id);
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'del') {
    if (confirm(`${c?.name || '이 고객'} 을(를) 삭제할까요?`)) send('customer-delete', { id });
  } else if (act === 'edit') {
    custDraft = { ...c };
    $('cf-name').value = c.name || '';
    $('cf-age').value = c.age || '';
    renderCustomers(lastState);
    $('cf-name').scrollIntoView({ behavior: 'smooth', block: 'center' });
  } else {
    send('customer-select', { id });
    toast(`${c?.name || '고객'} 선택됨`);
  }
};

$('cf-save').onclick = () => {
  const name = $('cf-name').value.trim();
  if (!name) return toast('이름을 입력하세요');
  send('customer-save', { customer: { ...custDraft, name, age: Number($('cf-age').value) || null } });
  toast(custDraft.id ? '수정했습니다' : '추가했습니다');
  resetDraft();
};
$('cf-reset').onclick = () => { resetDraft(); toast('새로 입력합니다'); };
function resetDraft() {
  custDraft = {};
  $('cf-name').value = ''; $('cf-age').value = '';
  renderCustomers(lastState || {});
}

  chipRow('sf-int', INTENSITIES, cfg.intensity, patch('intensity'));
  chipRow('sf-focus', FOCUS, cfg.focus, patch('focus'));

    toast('프로그램을 만드는 중...');

  }
  const play = e.target.closest('[data-play-session]');

// 카드를 두 번 누르면 재생
let lastTap = { id: null, at: 0 };
$('prog-list').addEventListener('click', e => {
  const card = e.target.closest('[data-session]');
  if (!card || e.target.closest('[data-play-session]')) return;
  const id = card.dataset.session, now = Date.now();
  if (lastTap.id === id && now - lastTap.at < 400) {
    send('play-session', { id });
    toast('재생을 시작합니다');
    lastTap = { id: null, at: 0 };
  } else {
    lastTap = { id, at: now };
  }
});

/* ---------- 프로그램 빌더 ---------- */
function renderBuilder(s) {
  const blocks = s.blocks || [];
  const PHASE = { warmup: '준비', main: '본운동', cooldown: '정리' };
  $('bl-count').textContent = `프로그램 · ${blocks.length}개 동작`
    + (s.totalSeconds ? ` · 약 ${human(s.totalSeconds)}` : '');
  $('bl-list').innerHTML = blocks.length ? blocks.map((b, i) => {
    const c = b.clip || {};
    const [, color] = CAT[c.code] || [, '#7A7A86'];
    return `<div class="card col" data-uid="${b.uid}">
      <div class="head">
        <span class="chip" style="background:${color}22;color:${color}">${c.code || '?'}</span>
        <div class="nm"><b>${c.name || c.fileName || '—'}</b>
          <small>${[PHASE[b.phase], c.part].filter(Boolean).join(' · ')}</small></div>
      </div>
      <div class="acts">
        <button class="icon-btn" data-act="sets-">−</button>
        <span class="stepper"><span>${b.sets}세트</span></span>
        <button class="icon-btn" data-act="sets+">+</button>
        <span class="spacer"></span>
        <button class="icon-btn" data-act="up" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button class="icon-btn" data-act="down" ${i === blocks.length - 1 ? 'disabled' : ''}>↓</button>
        <button class="icon-btn danger" data-act="del">✕</button>
      </div>
    </div>`;
  }).join('') : '<div class="empty">동작이 없습니다.<br>아래 라이브러리에서 추가하거나<br>세션 탭에서 자동 조합하세요.</div>';

  const clips = s.clips || [];
  const f = libFilter.trim().toLowerCase();
  const shown = (f ? clips.filter(c => (c.name || '').toLowerCase().includes(f)) : clips).slice(0, 60);
  $('bl-lib').innerHTML = shown.length ? shown.map(c => {
    const [, color] = CAT[c.code] || [, '#7A7A86'];
    return `<div class="card" data-clip="${c.id}">
      <span class="chip" style="background:${color}22;color:${color}">${c.code || '?'}</span>
      <div class="nm"><b>${c.name || '—'}</b>
        <small>${[c.part, c.reps ? c.reps + '회' : ''].filter(Boolean).join(' · ')}</small></div>
      <button class="icon-btn" data-act="add">+</button>
    </div>`;
  }).join('') : '<div class="empty">검색 결과가 없습니다.</div>';
}

$('bl-list').onclick = e => {
  const card = e.target.closest('[data-uid]'); if (!card) return;
  const uid = card.dataset.uid;
  const act = e.target.closest('[data-act]')?.dataset.act;
  const b = (lastState?.blocks || []).find(x => x.uid === uid);
  if (act === 'del') send('block-remove', { uid });
  else if (act === 'up') send('block-move', { uid, dir: 'up' });
  else if (act === 'down') send('block-move', { uid, dir: 'down' });
  else if (act === 'sets+') send('block-update', { uid, patch: { sets: Math.min(9, (b?.sets || 1) + 1) } });
  else if (act === 'sets-') send('block-update', { uid, patch: { sets: Math.max(1, (b?.sets || 1) - 1) } });
};
$('bl-lib').onclick = e => {
  const card = e.target.closest('[data-clip]'); if (!card) return;
  send('block-add', { clipId: card.dataset.clip });
  toast('추가했습니다');
};
$('bl-search').oninput = e => { libFilter = e.target.value; renderBuilder(lastState || {}); };
$('bl-clear').onclick = () => {
  if (confirm('프로그램을 전부 비울까요?')) send('blocks-clear');
};

// 매초 오는 tick 으로 시간 표시만 갱신한다. 목록은 다시 그리지 않는다.
function renderTime() {
  const s = lastState;
  if (!s || screen !== 'remote') return;
  const cur = (s.queue || [])[s.currentIndex || 0];

  if (cur?.type === 'rest' && tick.restCountdown != null) {
    $('now-title').textContent = `${tick.restCountdown}초`;
  } else if (cur?.type === 'break' && tick.restCountdown != null) {
    $('now-title').textContent = mmss(tick.restCountdown);
  }

  const total = s.totalSeconds || 0;
  const el = $('now-times');
  if (!el) return;
  if (!total) { el.innerHTML = ''; return; }
  el.innerHTML =
    `<span>세션 <b>${mmss(tick.elapsedSeconds)}</b> / ${mmss(total)}</span>`
    + `<span class="left">남은 ${human(tick.remainingSeconds)}</span>`
    + (cur?.type === 'clip' && tick.duration
        ? `<span>이 동작 ${mmss(tick.progress)} / ${mmss(tick.duration)}</span>` : '');
}

/* ---------- 설정 ---------- */
const SPEEDS = [0.5, 1, 1.5, 2];

function renderSettings(s) {
  s = s || {};
  const st = s.settings || {};
  const tg = (on, key) =>
    `<button class="tg ${on ? 'on' : ''}" data-toggle="${key}"><span></span></button>`;

  $('set-play').innerHTML = `
    <div class="srow">
      <div class="t"><b>휴식 중 다음 동작 미리보기</b>
        <small>쉬는 동안 다음 동작 영상을 무음으로 보여줍니다.</small></div>
      ${tg(st.restPreview !== false, 'restPreview')}
    </div>
    <div class="srow">
      <div class="t"><b>기본 재생 속도</b><small>재생을 시작할 때의 배속입니다.</small></div>
      <div class="seg" style="flex-shrink:0">
        ${SPEEDS.map(v => `<button data-speed="${v}" class="${st.defaultSpeed === v ? 'on' : ''}"
          style="padding:8px 10px">${v}x</button>`).join('')}
      </div>
    </div>`;

  const pending = s.codecPending || 0;
  $('set-conv').innerHTML = `
    <div class="srow">
      <div class="t"><b>자동으로 미리 변환</b>
        <small>재생할 수 없는 형식을 PC 가 켜져 있을 때 미리 바꿔 둡니다.</small></div>
      ${tg(!!s.autoConvert, 'autoConvert')}
    </div>
    <div class="srow">
      <div class="t"><b>변환이 필요한 영상</b>
        <small>${s.converting ? '지금 변환하고 있습니다' : pending ? '아직 변환되지 않았습니다' : '모두 재생할 수 있습니다'}</small></div>
      <span style="font-size:14px;font-weight:600;color:${pending ? 'var(--warn)' : '#22C55E'}">
        ${pending ? pending + '개' : '없음'}</span>
      ${pending && !s.converting ? '<button class="icon-btn" data-convert="1">▶</button>' : ''}
    </div>`;

  // PC 목록. 다른 PC 를 누르면 그 PC 화면으로 옮겨간다.
  const pcs = loadPcs();
  $('set-pcs').innerHTML = pcs.length ? pcs.map(pc => {
    const here = pc.url === HERE;
    return `<div class="srow ${here ? 'here' : ''}" data-pc="${pc.url}">
      <div class="t">
        <b>${pcLabel(pc)}${here ? ' <span style="font-size:11px;color:var(--accent)">· 사용 중</span>' : ''}</b>
        <small>${pc.url}</small>
      </div>
      <button class="icon-btn" data-rename="${pc.url}">✎</button>
      ${here ? '' : `<button class="icon-btn" data-switch="${pc.url}">▶</button>`}
      ${here ? '' : `<button class="icon-btn danger" data-forget="${pc.url}">✕</button>`}
    </div>`;
  }).join('')
    : '<div class="empty">이 PC 만 등록되어 있습니다.</div>';

  $('set-pcs').insertAdjacentHTML('beforeend', `
    <div class="srow" data-add="1" style="border-style:dashed">
      <div class="t"><b style="color:var(--accent)">+ PC 추가</b>
        <small>다른 PC 의 설정 화면에 적힌 접속 주소를 입력하면 목록에 추가됩니다.</small></div>
    </div>`);

  $('set-conn').innerHTML = `
    <div class="srow">
      <div class="t"><b>이 기기 연결 해제</b>
        <small>로그아웃하고 PIN 을 다시 입력합니다.</small></div>
      <button class="icon-btn danger" data-logout="1" style="width:auto;padding:0 14px">해제</button>
    </div>`;
}

$('sc-settings').addEventListener('click', e => {
  const t = e.target.closest('[data-toggle]');
  if (t) {
    const key = t.dataset.toggle;
    const on = !t.classList.contains('on');
    if (key === 'autoConvert') send('set-auto-convert', { value: on });
    else send('set-setting', { key, value: on });
    t.classList.toggle('on', on);
    return;
  }
  const sp = e.target.closest('[data-speed]');
  if (sp) {
    send('set-setting', { key: 'defaultSpeed', value: Number(sp.dataset.speed) });
    sp.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === sp));
    return;
  }
  if (e.target.closest('[data-convert]')) { send('convert-now'); toast('변환을 시작합니다'); return; }
  if (e.target.closest('[data-logout]')) { showLogin('연결을 해제했습니다'); return; }

  if (e.target.closest('[data-add]')) {
    const v = prompt('추가할 PC 의 접속 주소\n(예: http://192.168.0.10:3737)', 'http://');
    if (!v) return;
    let url;
    try {
      url = new URL(v.trim().startsWith('http') ? v.trim() : 'http://' + v.trim());
      if (!url.port) url.port = '3737';
      url = url.origin;
    } catch { return toast('주소를 확인해 주세요'); }
    const list = loadPcs();
    if (list.some(p => p.url === url)) return toast('이미 목록에 있습니다');
    list.push({ url, id: '', name: url, nick: '' });
    savePcs(list);
    renderSettings(lastState);
    toast('추가했습니다. 눌러서 접속하세요');
    return;
  }

  const rn = e.target.closest('[data-rename]');
  if (rn) {
    const url = rn.dataset.rename;
    const list = loadPcs();
    const pc = list.find(p => p.url === url);
    const v = prompt('이 PC 의 애칭', pcLabel(pc));
    if (v !== null) {
      pc.nick = v.trim();
      savePcs(list);
      renderSettings(lastState);
      if (url === HERE) $('conn').textContent = pcLabel(pc);
      toast('애칭을 바꿨습니다');
    }
    return;
  }
  const sw = e.target.closest('[data-switch]');
  if (sw) { toast('PC 를 옮깁니다...'); gotoPc(sw.dataset.switch); return; }

  const fg = e.target.closest('[data-forget]');
  if (fg) {
    const url = fg.dataset.forget;
    if (!confirm('이 PC 를 목록에서 지울까요?')) return;
    savePcs(loadPcs().filter(p => p.url !== url));
    renderSettings(lastState);
  }
});

/* ---------- 화면 ---------- */
function render(s) {
  if (!s) return;
  lastState = s;
  if (s.toast) toast(s.toast);

  if (screen === 'customer') return renderCustomers(s);
  if (screen === 'session') return renderSession(s);
  if (screen === 'builder') return renderBuilder(s);
  if (screen === 'settings') return renderSettings(s);

  const q = s.queue || [], ci = s.currentIndex || 0, cur = q[ci];

  $('play-label').textContent = s.playing ? '일시정지' : '재생';
  $('play-icon').innerHTML = s.playing
    ? '<path d="M7 5h3.5v14H7zm6.5 0H17v14h-3.5z"/>'
    : '<path d="M8 5v14l11-7z"/>';

  document.querySelectorAll('#speed button').forEach(b =>
    b.classList.toggle('on', Number(b.dataset.v) === (s.speed ?? 1)));

  const now = $('now');
  now.classList.toggle('resting', cur?.type === 'rest');
  now.classList.toggle('breaking', cur?.type === 'break');
  if (cur?.type === 'clip') {
    const c = cur.clip || {};
    $('now-lab').textContent = cur.sessionName ? `현재 동작 · ${cur.sessionName}` : '현재 동작';
    $('now-title').textContent = c.name || c.fileName || '—';
    const [label, color] = CAT[c.code] || [];
    $('now-meta').innerHTML =
      (c.code ? `<span class="chip" style="background:${color}22;color:${color}">${label || c.code}</span>` : '')
      + (c.part ? `<span>${c.part}</span>` : '')
      + (c.reps ? `<span>${c.reps}회</span>` : '')
      + (cur.totalSets > 1 ? `<span>세트 ${cur.setNum}/${cur.totalSets}</span>` : '');
  } else if (cur?.type === 'break') {
    $('now-lab').textContent = '세션 간 휴식';
    $('now-title').textContent = mmss(tick.restCountdown ?? cur.duration);
    $('now-meta').innerHTML =
      `<span>${cur.sessionName || '세션'} 완료</span>`
      + `<span class="chip" style="background:#22C55E22;color:#22C55E">다음 · ${cur.nextName || ''}</span>`;
  } else if (cur?.type === 'rest') {
    $('now-lab').textContent = cur.restKind === 'set' ? '세트 휴식' : '동작 전환 휴식';
    $('now-title').textContent = `${tick.restCountdown ?? cur.duration}초`;
    // 쉬는 동안 다음에 뭘 하는지 보여준다
    const nx = q.slice(ci + 1).find(i => i.type === 'clip');
    if (nx) {
      const c = nx.clip || {};
      const [label, color] = CAT[c.code] || [];
      $('now-meta').innerHTML =
        `<span style="color:var(--dim)">다음 ·</span>`
        + (c.code ? `<span class="chip" style="background:${color}22;color:${color}">${label || c.code}</span>` : '')
        + `<span style="color:var(--text);font-weight:600">${c.name || ''}</span>`
        + (c.reps ? `<span>${c.reps}회</span>` : '')
        + (nx.totalSets > 1 ? `<span>세트 ${nx.setNum}/${nx.totalSets}</span>` : '');
    } else {
      $('now-meta').textContent = '';
    }
  } else {
    $('now-lab').textContent = '현재 동작';
    $('now-title').textContent = '—';
    $('now-meta').textContent = '';
  }
  $('now-bar').style.width = q.length ? `${((ci + 1) / q.length) * 100}%` : '0%';
  renderTime();

  if (q.length === 0) {
    $('list').innerHTML =
      '<div class="empty">재생 중인 프로그램이 없습니다.<br>PC 에서 프로그램을 먼저 만들어 주세요.</div>';
    return;
  }

  $('list').innerHTML = q.map((it, i) => {
    const cls = i === ci ? 'active' : i < ci ? 'done' : '';
    if (it.type === 'break') {
      return `<div class="item brk ${cls}" data-i="${i}"><span class="idx">◆</span>
        <span class="nm">세션 간 휴식 ${human(it.duration)} · 다음 ${it.nextName || ''}</span></div>`;
    }
    if (it.type === 'rest') {
      return `<div class="item rest ${cls}" data-i="${i}"><span class="idx">·</span>
        <span class="nm">${it.restKind === 'set' ? '세트 휴식' : '전환 휴식'} ${it.duration}초</span></div>`;
    }
    const c = it.clip || {};
    const [, color] = CAT[c.code] || [, '#7A7A86'];
    return `<div class="item ${cls}" data-i="${i}">
      <span class="idx">${i + 1}</span>
      <span class="chip" style="background:${color}22;color:${color}">${c.code || '?'}</span>
      <span class="nm">${c.name || c.fileName || '—'}</span>
      ${it.totalSets > 1 ? `<span class="sets">${it.setNum}/${it.totalSets}</span>` : ''}
      ${editing ? '<button class="del" data-del="1">✕</button>' : ''}
    </div>`;
  }).join('');
}

// 항목을 누르면 그 동작으로 이동, 편집 중 ✕ 는 삭제
$('list').onclick = e => {
  const row = e.target.closest('[data-i]');
  if (!row) return;
  const i = Number(row.dataset.i);
  if (e.target.closest('[data-del]')) send('remove', { index: i });
  else send('goto', { index: i });
};

/* ---------- 시작 ---------- */
(async () => {
  const token = localStorage.getItem(KEY);
  if (!token) return showLogin();
  const r = await fetch('/api/session', { headers: { 'x-remote-token': token } }).catch(() => null);
  const info = r ? await r.json().catch(() => null) : null;
  if (info?.ok) { rememberPc(info); connect(token); }
  else showLogin();
})();
</script>
</body>
</html>
