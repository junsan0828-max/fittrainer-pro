name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  # 빌드 성공과 앱이 실제로 뜨는 것은 다른 문제다.
  # 1.1.0~1.9.0 은 모두 빌드에 성공했지만 실행하면 흰 화면으로 죽었다.
  # 설치 파일을 만들기 전에 화면을 진짜로 띄워 모든 탭을 눌러 본다.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fittrainer-pro/package-lock.json

      - name: Install dependencies
        working-directory: fittrainer-pro
        run: npm ci

      - name: Install Chromium
        working-directory: fittrainer-pro
        run: npx playwright install --with-deps chromium

      - name: Build renderer
        working-directory: fittrainer-pro
        run: npm run build:renderer

      - name: Smoke test
        working-directory: fittrainer-pro
        run: npm test

  build:
    needs: smoke
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fittrainer-pro/package-lock.json

      # Electron 런타임(111MB)은 매번 GitHub 에서 받는다.
      # 한 번 받아두면 다음 빌드는 캐시를 쓰므로 다운로드 실패 자체가 줄어든다.
      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('fittrainer-pro/package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        working-directory: fittrainer-pro
        run: npm ci

      # 입력한 버전이 설치 파일과 앱 정보에도 반영되게 한다.
      # 이 단계가 없어서 릴리스 태그만 올라가고 앱은 계속 1.0.0 이라고 표시됐다.
      - name: Set version
        working-directory: fittrainer-pro
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version --allow-same-version

      - name: Build renderer
        working-directory: fittrainer-pro
        run: npm run build:renderer

      # 다운로드가 끊겨 실패하는 일이 있어 몇 번 다시 시도한다.
      - name: Build Windows installer
        working-directory: fittrainer-pro
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "=== electron-builder 시도 $i/3 ==="
            npx electron-builder --win --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -lt 3) {
              Write-Host "실패. 20초 후 다시 시도합니다."
              Start-Sleep -Seconds 20
            }
          }
          Write-Host "3회 모두 실패했습니다."
          exit 1

      - name: List dist
        working-directory: fittrainer-pro
        run: dir dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: FitTrainer Pro v${{ github.event.inputs.version }}
          body: |
            ## FitTrainer Pro v${{ github.event.inputs.version }}

            ### How to install
            1. Download `FitTrainer Pro Setup.exe` below
            2. Run and install (you can choose the installation path)
            3. Launch FitTrainer Pro from the desktop shortcut
            4. Select your workout video folder and start using it

            > Copy your workout video files separately before use.
          files: fittrainer-pro/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
